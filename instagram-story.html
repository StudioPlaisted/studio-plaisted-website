<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Story — Studio Plaisted</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 24px;
      color: #999;
    }
    .preview {
      max-width: 360px;
      width: 100%;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .preview canvas {
      width: 100%;
      height: auto;
      display: block;
    }
    button {
      background: #954d14;
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 16px;
    }
    button:hover { background: #b35e1a; }
    .note {
      font-size: 11px;
      color: #444;
      text-align: center;
      line-height: 1.6;
    }
    .source { display: none; }
  </style>
</head>
<body>

  <h1>Instagram Story</h1>

  <div class="source">
    <canvas id="source" width="1080" height="1920"></canvas>
  </div>

  <div class="preview">
    <canvas id="preview" width="1080" height="1920"></canvas>
  </div>

  <button onclick="downloadStory()">Download Story</button>
  <div class="note">1080 &times; 1920px (9:16 story format)</div>

  <script>
    const W = 1080;
    const H = 1920;
    const TERRACOTTA = '#954d14';
    const DOT_COLOR = '#0408FF';
    const DOT_RADIUS = 2.5;
    const DOT_SPACING = 24;

    const logoImg = new Image();
    logoImg.src = 'images/logo-white.svg';

    const heroImg = new Image();
    heroImg.crossOrigin = 'anonymous';
    heroImg.src = 'images/hero.jpg';

    Promise.all([
      new Promise(r => { if (logoImg.complete) r(); else logoImg.onload = r; }),
      new Promise(r => { if (heroImg.complete) r(); else heroImg.onload = r; })
    ]).then(render);

    function render() {
      const canvas = document.getElementById('source');
      const ctx = canvas.getContext('2d');

      // -- Top half: terracotta --
      const splitY = Math.round(H * 0.5);
      ctx.fillStyle = TERRACOTTA;
      ctx.fillRect(0, 0, W, splitY);

      // -- Bottom half: hero image --
      const bottomH = H - splitY;
      const imgAspect = heroImg.naturalWidth / heroImg.naturalHeight;
      const targetAspect = W / bottomH;
      let sx, sy, sw, sh;
      if (imgAspect > targetAspect) {
        sh = heroImg.naturalHeight;
        sw = sh * targetAspect;
        sx = (heroImg.naturalWidth - sw) / 2;
        sy = 0;
      } else {
        sw = heroImg.naturalWidth;
        sh = sw / targetAspect;
        sx = 0;
        sy = (heroImg.naturalHeight - sh) / 2;
      }
      ctx.drawImage(heroImg, sx, sy, sw, sh, 0, splitY, W, bottomH);

      // -- Blue dot overlay --
      ctx.fillStyle = DOT_COLOR;
      for (let y = DOT_SPACING / 2; y < H; y += DOT_SPACING) {
        for (let x = DOT_SPACING / 2; x < W; x += DOT_SPACING) {
          ctx.beginPath();
          ctx.arc(x, y, DOT_RADIUS, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // -- Logo aligned so the connecting line sits exactly at the split --
      // SVG viewBox: "90 340 840 95". Line rect is at y=387.84, height=12
      // Line center within viewBox: (387.84 + 6 - 340) / 95 = 0.567
      const logoAspect = 840 / 95;
      const logoW = W * 0.82;
      const logoH = logoW / logoAspect;
      const logoX = (W - logoW) / 2;
      const lineRatio = (387.84 + 6 - 340) / 95; // where the line center sits within the logo
      const logoY = splitY - (lineRatio * logoH);

      ctx.drawImage(logoImg, logoX, logoY, logoW, logoH);

      // -- Copy to preview --
      const preview = document.getElementById('preview');
      const pctx = preview.getContext('2d');
      pctx.drawImage(canvas, 0, 0);
    }

    function downloadStory() {
      const canvas = document.getElementById('source');
      const link = document.createElement('a');
      link.download = 'studio-plaisted-story.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>

</body>
</html>
